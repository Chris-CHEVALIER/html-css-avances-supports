<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Contrepoint 2027 – Festival de musiques actuelles</title>
    <!-- La police est demandée tout de suite, avant le CSS -->
    <link
      rel="preload"
      href="../../../assets/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="hero">
      <!-- Image LCP : prioritaire, jamais en lazy -->
      <picture>
        <source
          type="image/webp"
          srcset="
            https://picsum.photos/id/452/800/450.webp   800w,
            https://picsum.photos/id/452/1600/900.webp 1600w
          "
          sizes="(min-width: 60rem) 60rem, 100vw"
        />
        <img
          src="https://picsum.photos/id/452/1600/900"
          srcset="
            https://picsum.photos/id/452/800/450   800w,
            https://picsum.photos/id/452/1600/900 1600w
          "
          sizes="(min-width: 60rem) 60rem, 100vw"
          width="1600"
          height="900"
          alt="La foule devant la grande scène"
          fetchpriority="high"
        />
      </picture>
      <h1>Contrepoint 2027</h1>
    </header>
    <main>
      <h2>Têtes d'affiche</h2>
      <ul class="lineup">
        <li>
          <!-- Sous la ligne de flottaison : chargée à l'approche -->
          <img
            src="https://picsum.photos/id/145/400/400"
            width="400"
            height="400"
            alt="La guitare de Nadia Ferrant"
            loading="lazy"
          />
          Nadia Ferrant
        </li>
        <li>
          <img
            src="https://picsum.photos/id/453/400/400"
            width="400"
            height="400"
            alt="Les Ondes Courtes sur scène"
            loading="lazy"
          />
          Les Ondes Courtes
        </li>
      </ul>
      <section class="archives">
        <h2>Les éditions précédentes</h2>
        <p>
          Depuis 2015, Contrepoint réunit chaque année plus de 30 000
          spectateurs sur les bords du canal.
        </p>
      </section>
    </main>
  </body>
</html>
