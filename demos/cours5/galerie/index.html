<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Galerie – Contrepoint</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/galerie.js" defer></script>
  </head>
  <body>
    <main>
      <h1>L'édition 2026 en images</h1>
      <figure class="stage">
        <img
          src="https://picsum.photos/id/158/960/540"
          alt="La grande scène sous les projecteurs"
          width="960"
          height="540"
        />
        <figcaption>La grande scène</figcaption>
      </figure>
      <ul class="thumbs">
        <li>
          <button
            type="button"
            aria-current="true"
            data-id="158"
            data-caption="La grande scène"
          >
            <img
              src="https://picsum.photos/id/158/240/135"
              alt="La grande scène sous les projecteurs"
              width="240"
              height="135"
            />
          </button>
        </li>
        <li>
          <button
            type="button"
            data-id="452"
            data-caption="Le public du samedi soir"
          >
            <img
              src="https://picsum.photos/id/452/240/135"
              alt="Le public, mains levées devant la scène"
              width="240"
              height="135"
            />
          </button>
        </li>
        <li>
          <button
            type="button"
            data-id="453"
            data-caption="Un groupe en concert"
          >
            <img
              src="https://picsum.photos/id/453/240/135"
              alt="Un chanteur et sa guitare sous un projecteur"
              width="240"
              height="135"
            />
          </button>
        </li>
      </ul>
      <p><a href="credits.html">Crédits photo</a></p>
    </main>
  </body>
</html>
