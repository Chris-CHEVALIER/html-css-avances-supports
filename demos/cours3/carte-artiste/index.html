<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Container queries – Contrepoint</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="layout">
      <main class="card-zone">
        <h1>À la une</h1>
        <article class="artist-card">
          <img
            src="https://picsum.photos/id/453/600/600"
            alt="Nova Lune sur scène, guitare à la main, sous les projecteurs"
            width="600"
            height="600"
          >
          <div class="artist-card__body">
            <h2>Nova Lune</h2>
            <p>Pop électronique, vendredi 21h, grande scène.</p>
          </div>
        </article>
      </main>
      <aside class="card-zone">
        <h2>Ne manquez pas</h2>
        <article class="artist-card">
          <img
            src="https://picsum.photos/id/1082/600/600"
            alt="Les mains de Malo Rive sur le clavier d'un piano"
            width="600"
            height="600"
          >
          <div class="artist-card__body">
            <h2>Malo Rive</h2>
            <p>Piano jazz, dimanche 18h, scène du parc.</p>
          </div>
        </article>
      </aside>
    </div>
  </body>
</html>
