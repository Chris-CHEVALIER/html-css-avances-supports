<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sélecteurs avancés – Contrepoint</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container">
      <h1>Programme du samedi</h1>
      <ul class="lineup">
        <li class="is-headliner">Les Ondes</li>
        <li>Kiss Kiss Orchestra</li>
        <li class="is-headliner">Nova Lune</li>
        <li class="is-cancelled">Duo Brume (annulé)</li>
        <li class="is-headliner">Malo Rive</li>
        <li>DJ Pollen</li>
      </ul>

      <h2>Newsletter</h2>
      <form class="newsletter" action="#" method="post">
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          >
          <p class="field__error" id="email-error">
            Saisissez une adresse e-mail valide.
          </p>
        </div>
        <div class="field field--check">
          <input id="consent" name="consent" type="checkbox" required>
          <label for="consent">
            J'accepte de recevoir la newsletter
          </label>
        </div>
        <button type="submit">S'inscrire</button>
      </form>
    </main>
  </body>
</html>
