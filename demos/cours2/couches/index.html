<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Couches de cascade – Contrepoint</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container">
      <h1>Têtes d'affiche</h1>
      <div class="slidy">
        <div class="slidy__track">
          <article class="card">
            <h2>Nova Lune</h2>
            <p>Pop électronique, vendredi 21h.</p>
            <button class="btn" type="button">Réserver</button>
          </article>
          <article class="card card--sold-out">
            <h2>Les Ondes</h2>
            <p>Rock, samedi 22h. Complet.</p>
            <button class="btn" type="button" disabled>Complet</button>
          </article>
        </div>
      </div>
    </main>
  </body>
</html>
