<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Variables et couleurs – Contrepoint</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container">
      <fieldset class="settings">
        <legend>Apparence</legend>
        <label>
          <input id="dark-mode" type="checkbox"> Thème sombre
        </label>
        <label>
          <input id="hue-violet" type="checkbox"> Teinte violette
        </label>
      </fieldset>

      <article class="ticket">
        <h1>Pass 3 jours</h1>
        <p>Du 3 au 5 juillet, toutes les scènes.</p>
        <p class="ticket__price">89 €</p>
        <a class="ticket__cta" href="#acheter">Acheter</a>
      </article>
    </main>
  </body>
</html>
